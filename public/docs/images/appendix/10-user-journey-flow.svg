  <path d="M 890 425 L 730 425" class="flow-arrow" marker-end="url(#arrowRight)" />
  <path d="M 640 425 L 480 425" class="flow-arrow" marker-end="url(#arrowRight)" />
  <path d="M 390 425 L 230 425" class="flow-arrow" marker-end="url(#arrowRight)" />

