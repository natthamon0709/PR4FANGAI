<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&amp;display=swap');
      * {
        font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .flow-arrow {
        stroke: #64748b;
        stroke-width: 2.5;
        fill: none;
      }
      .loop-arrow {
        stroke: #ea580c;
        stroke-width: 2.2;
        stroke-dasharray: 6 5;
        fill: none;
      }
      .node-badge-num {
        font-size: 13px;
        font-weight: 800;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .node-badge-q {
        font-size: 12px;
        font-weight: 800;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .role-label {
        font-size: 13px;
        font-weight: 700;
        text-anchor: middle;
      }
      .step-title {
        font-size: 15px;
        font-weight: 800;
        fill: #0f172a;
        text-anchor: middle;
      }
      .step-desc {
        font-size: 11.5px;
        font-weight: 400;
        fill: #475569;
        text-anchor: middle;
      }
      .step-channel {
        font-size: 11.5px;
        font-weight: 700;
        text-anchor: middle;
      }
    </style>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

