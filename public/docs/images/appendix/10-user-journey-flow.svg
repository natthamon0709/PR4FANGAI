  <!-- Curve from Row 2 (Node 8) to Row 3 (Node 9) on the left -->
  <path d="M 140 425 C 50 425, 50 665, 140 665" class="flow-arrow" marker-end="url(#arrowRight)" />

  <!-- Row 3: Node 9 -> Node 10 -> End -->
  <path d="M 230 665 L 390 665" class="flow-arrow" marker-end="url(#arrowRight)" />
  <path d="M 480 665 L 610 665" class="flow-arrow" marker-end="url(#arrowRight)" />

